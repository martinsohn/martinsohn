<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type"
        content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Sohn Christensen</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        color: #333;
        background-color: #fff;
      }

      h1 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
        margin-bottom: 30px;
      }

      h3 {
        color: #34495e;
        margin-top: 40px;
        margin-bottom: 15px;
      }

      a {
        color: #3498db;
        text-decoration: none;
      }

      a:hover {
        color: #2980b9;
        text-decoration: underline;
      }

      ul {
        padding-left: 20px;
      }

      li {
        margin-bottom: 8px;
      }

      /* Responsive adjustments */
      @media (max-width: 600px) {
        body {
          padding: 15px;
        }

        h1 {
          font-size: 1.8em;
        }

        ul {
          padding-left: 15px;
        }
      }
    </style>
  </head>
  <body>
$body$
  </body>
</html>
